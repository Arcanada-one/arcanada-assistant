version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'docker'
    directory: '/apps/assistant'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Base images are where OS-level CVEs accumulate, and a digest-pinned FROM
    # cannot rot visibly -- nobody reads a sha256 and notices it is a year old.
    # Keep Node on the 24.x line (#104); ignore major bumps such as #69 (25-alpine).
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
