name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: deploy-arcanada-assistant
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.3'

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint

  test:
    runs-on: [self-hosted, Linux, X64, arcana-ai]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: assistant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assistant_app -d assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant_app:ci_password@localhost:5432/assistant?schema=public&sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcanada/core build
      - run: cd apps/assistant && pnpm exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r test:coverage

  audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  smoke:
    needs: [lint, test, audit]
    runs-on: [self-hosted, Linux, X64, arcana-ai]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: assistant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assistant_app -d assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant_app:ci_password@localhost:5432/assistant?schema=public&sslmode=disable
      REDIS_URL: redis://localhost:6379/1
      PORT: '3800'
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ci-stub-token
      TELEGRAM_WEBHOOK_SECRET: ci-stub-secretci-stub-secretci-stub-secret
      TELEGRAM_WEBHOOK_PATH: /webhook/telegram
      AUTH_ARCANA_BASE_URL: https://auth.arcanada.one
      AUTH_ARCANA_JWKS_URL: https://auth.arcanada.one/.well-known/jwks.json
      AUTH_ARCANA_JWT_ISSUER: https://auth.arcanada.one
      AUTH_ARCANA_JWT_AUDIENCE: arcanada-assistant
      MODEL_CONNECTOR_BASE_URL: http://stub.invalid:9999
      MODEL_CONNECTOR_HEALTH_URL: https://stub.invalid
      MODEL_CONNECTOR_DEFAULT_MODEL: anthropic/claude-haiku-4-5
      MODEL_CONNECTOR_API_KEY: ci-stub-mc-key
      SCRUTATOR_BASE_URL: http://stub.invalid:8310
      SCRUTATOR_LTM_NAMESPACE: ci-stub-ns
      OPSBOT_BASE_URL: https://stub.invalid
      OPSBOT_API_KEY: ci-stub
      MUNERA_BASE_URL: http://stub.invalid:3500
      MUNERA_API_TOKEN: ci-stub-munera-token
      BRIEFING_TIMEZONE: UTC
      BRIEFING_MORNING_TIME: '08:00'
      BRIEFING_EVENING_TIME: '21:00'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/assistant && pnpm exec prisma generate
      - run: pnpm --filter @arcanada/core build
      - run: pnpm --filter assistant build
      - name: Run prisma migrate deploy
        run: cd apps/assistant && pnpm exec prisma migrate deploy
      - name: Boot app + smoke /health
        run: |
          cd apps/assistant
          node dist/main.js > /tmp/assistant.log 2>&1 &
          APP_PID=$!
          # ARCA-0033 intent: verify the app boots, not that all upstreams
          # are reachable (Scrutator/MC/OpsBot stubs intentionally point at
          # invalid hosts in CI). Treat any HTTP response from /health as
          # boot success — only TCP-refused / no-response within 30 s fails.
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://localhost:3800/health || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "smoke responded http=${HTTP_CODE} after ${i}s"
              cat /tmp/health.json
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          echo "smoke failed: /health did not respond within 30s"
          echo "--- assistant.log (tail 200) ---"
          tail -200 /tmp/assistant.log || true
          kill -9 $APP_PID || true
          exit 1

  # SEC-0063: this job used to own its own deploy path — it held a runner-owned
  # checkout at /opt/arcanada-assistant, wrote the production .env there with a
  # heredoc, and drove `docker compose` against the host socket directly. That
  # is the arrangement SEC-0028 removed from every other service on arcana-prod
  # on 2026-07-30; the assistant was the one that was missed. When the `docker`
  # group was retired the job did not start failing quietly — it failed loudly,
  # at `permission denied ... /var/run/docker.sock`, on every push to main since.
  #
  # Three defects died with the old block, and they are worth naming because
  # none of them is about the docker socket:
  #   * The heredoc was unquoted, so backticks in its own explanatory comment
  #     were executed as command substitutions by the runner's shell. Harmless
  #     text this time; the construction is arbitrary command execution.
  #   * `git reset --hard origin/main` ran in a runner-owned .git, so nothing
  #     stopped the runner from repointing `origin` or checking out any SHA.
  #     The broker refuses a SHA that is not an ancestor of origin/main.
  #   * The .env was runner-owned 0600 — mode 600 protects a file from other
  #     users, not from its owner. Eight production credentials were readable
  #     by the runner account for as long as this job existed. They now live in
  #     /etc/arcanada/deploy-env/arcanada-assistant.env, root-owned, and are
  #     re-installed into the checkout by the broker on every sync.
  deploy:
    needs: [lint, test, audit, smoke]
    if: github.ref == 'refs/heads/main'
    # No `docker` label: this runner deliberately cannot reach the socket, and
    # a label claiming otherwise would misroute unrelated jobs onto production.
    runs-on: [self-hosted, linux, arcana-prod]
    steps:
      - uses: actions/checkout@v7
      - name: Verify deploy-broker capability
        env:
          BROKER_PREFLIGHT_SERVICE: arcanada-assistant
        run: bash scripts/ci/runner-broker-preflight.sh

      # The broker takes a service name from a compiled-in allowlist and a
      # commit SHA, and nothing else. No credential on stdin: this repository
      # is public, so `AUTH` is deliberately absent from its broker row and an
      # empty-stdin read would fail the sync.
      - name: Sync broker checkout to this commit
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant sync "$GITHUB_SHA"

      - name: Build image
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant build

      - name: Bring up stack
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant up

  verify:
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arcana-prod]
    steps:
      - name: Wait for /health
        run: |
          set -euo pipefail
          # A 503 is still accepted, because an upstream this deploy does not
          # own (Model Connector, Munera, Ops Bot) being unreachable is not a
          # reason to fail the assistant's own release. But 503 alone is too
          # weak a gate on its own: it is also what an assistant talking to an
          # EMPTY database would return, and that is precisely the failure a
          # botched compose-project rename produces — a parallel stack on a
          # fresh volume, serving happily. So the owned dependencies are
          # asserted by name from the body: postgres and redis must be `ok`
          # whatever the status code says.
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3800/health || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "responded http=${HTTP_CODE} after ${i}s"
              cat /tmp/health.json
              echo
              for dep in postgres redis; do
                STATE=$(python3 -c "import json;print(json.load(open('/tmp/health.json'))['dependencies'].get('${dep}',{}).get('status','ABSENT'))")
                if [ "$STATE" != "ok" ]; then
                  echo "verify failed: owned dependency ${dep} is '${STATE}', expected 'ok'"
                  sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant logs 200 || true
                  exit 1
                fi
                echo "owned dependency ${dep}: ok"
              done
              exit 0
            fi
            sleep 1
          done
          echo "health check did not respond within 30s"
          curl -v http://127.0.0.1:3800/health || true
          sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant logs 200 || true
          exit 1

      # Defends against a silent no-op build (INFRA-0039): a container that was
      # not recreated is running the previous code however green the deploy is.
      - name: Container freshness
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant freshness

      # Asserts the stack the broker drives is the one that was already live:
      # same compose project, therefore the same `arcanada-assistant_postgres-data`
      # volume. A parallel stack on a fresh volume is the migration's worst case.
      - name: Status snapshot
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant ps

  notify-on-fail:
    needs: [lint, test, audit, smoke, deploy, verify]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Notify Ops Bot
        run: |
          curl -fsS -X POST https://ops.arcanada.one/events \
            -H "Authorization: Bearer ${{ secrets.OPSBOT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "category": "fatal",
              "service": "arcanada-assistant",
              "source": "github-actions",
              "message": "CI/CD pipeline failed on '"${GITHUB_REF}"' (run '"${GITHUB_RUN_ID}"')",
              "details": {
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "sha": "${{ github.sha }}"
              }
            }' || true
