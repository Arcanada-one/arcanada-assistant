name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: deploy-arcanada-assistant
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.3'

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      # `dest` is pinned per job on purpose. Several runners on a host share
      # one OS user, so the action default `~/setup-pnpm` is ONE directory that
      # concurrent jobs install pnpm into simultaneously and corrupt (A2-227).
      # `runner.temp` is per runner and per job. Do not drop this.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: bash scripts/ci/retry-network.sh 3 pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      # A2-371 — the CI scripts that guard the deploy are tested where they are changed.
      - run: bash scripts/ci/retry-network.test.sh
      - run: python3 scripts/ci/test_deploy_lag_watchdog.py

  test:
    runs-on: [self-hosted, Linux, X64, arcana-ai]
    # The published host ports are deliberately left for the runner to assign
    # (`'5432/tcp'`, not `'5432:5432'`). These are SHARED self-hosted runners:
    # a fixed host port makes any two concurrent jobs -- or the host's own
    # postgres -- collide, and the job then dies in `Initialize containers`
    # with `failed to bind host port 0.0.0.0:5432/tcp: address already in use`
    # before a single test runs. That is what has been failing this job
    # intermittently on main since at least 2026-09-09; it is a race, which is
    # why the port looks free whenever one goes to check afterwards.
    #
    # The assigned port is read back from the `job.services.<id>.ports` context
    # below, so the connection strings follow whatever the runner chose.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: assistant
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U assistant_app -d assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # The `job` context is NOT available in a job-level `env:` block -- only
      # inside steps -- so the two URLs are exported here instead. Putting the
      # expansion in `env:` is accepted by the YAML parser and then fails the
      # whole run as a "workflow file issue", with no job and no annotation.
      - name: Resolve the runner-assigned service ports
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          echo "DATABASE_URL=postgresql://assistant_app:ci_password@localhost:${PG_PORT}/assistant?schema=public&sslmode=disable" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${REDIS_PORT}/0" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: bash scripts/ci/retry-network.sh 3 pnpm install --frozen-lockfile
      - run: pnpm --filter @arcanada/core build
      - run: cd apps/assistant && pnpm exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r test:coverage

  # A2-371 — every job that downloads from the registry runs its download through
  # scripts/ci/retry-network.sh. `deploy` needs all of them, so before this a single registry
  # ECONNRESET skipped the release (f3ab0d7, 2026-09-23: main undeployed for two days). The audit
  # stays a deploy precondition on purpose — it is the security-policy-mandate CI floor for
  # `typescript_pnpm` — so the fix is to make it answer, not to take it off the path.
  audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: bash scripts/ci/retry-network.sh 3 pnpm install --frozen-lockfile
      # A2-371 — retried ONLY on a network-error signature; a finding fails on the first attempt
      # with pnpm's own exit code, so the security-policy-mandate floor is unchanged.
      - run: bash scripts/ci/retry-network.sh 3 pnpm audit --prod --audit-level=high

  smoke:
    needs: [lint, test, audit]
    runs-on: [self-hosted, Linux, X64, arcana-ai]
    # Same rule as `test` above, and for a harder reason than a race: this job
    # used to publish `'5432:5432'`, and the arcana-ai label resolves to a
    # runner on arcana-prd, where 127.0.0.1:5432 is held permanently by
    # `arcanada-assistant-postgres-1` -- this service's own PRODUCTION
    # database. So the bind did not lose a race, it could never win one:
    # `Bind for 127.0.0.1:5432 failed: port is already allocated`, in
    # `Initialize containers`, before any repo code runs. Every PR's smoke was
    # red on that host (3/3 reruns on #72). Ephemeral host ports, read back
    # from `job.services.<id>.ports`, leave the production container alone.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: assistant
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U assistant_app -d assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    # DATABASE_URL / REDIS_URL / PORT are NOT here: the `job` context is
    # unavailable in a job-level `env:` block, and an expansion placed here
    # parses fine and then kills the whole run as a "workflow file issue" with
    # no job and no annotation. They are exported from the first step instead.
    env:
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ci-stub-token
      TELEGRAM_WEBHOOK_SECRET: ci-stub-secretci-stub-secretci-stub-secret
      TELEGRAM_WEBHOOK_PATH: /webhook/telegram
      AUTH_ARCANA_BASE_URL: https://auth.arcanada.one
      AUTH_ARCANA_JWKS_URL: https://auth.arcanada.one/.well-known/jwks.json
      AUTH_ARCANA_JWT_ISSUER: https://auth.arcanada.one
      AUTH_ARCANA_JWT_AUDIENCE: arcanada-assistant
      MODEL_CONNECTOR_BASE_URL: http://stub.invalid:9999
      MODEL_CONNECTOR_HEALTH_URL: https://stub.invalid
      MODEL_CONNECTOR_DEFAULT_MODEL: anthropic/claude-haiku-4-5
      MODEL_CONNECTOR_API_KEY: ci-stub-mc-key
      SCRUTATOR_BASE_URL: http://stub.invalid:8310
      SCRUTATOR_LTM_NAMESPACE: ci-stub-ns
      OPSBOT_BASE_URL: https://stub.invalid
      OPSBOT_API_KEY: ci-stub
      MUNERA_BASE_URL: http://stub.invalid:3500
      MUNERA_API_TOKEN: ci-stub-munera-token
      BRIEFING_TIMEZONE: UTC
      BRIEFING_MORNING_TIME: '08:00'
      BRIEFING_EVENING_TIME: '21:00'
    steps:
      - name: Resolve the runner-assigned service ports
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          echo "smoke services: postgres=${PG_PORT} redis=${REDIS_PORT}"
          echo "DATABASE_URL=postgresql://assistant_app:ci_password@localhost:${PG_PORT}/assistant?schema=public&sslmode=disable" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:${REDIS_PORT}/1" >> "$GITHUB_ENV"
          # The app's own port is picked the same way, and for a sharper
          # reason than tidiness. PORT used to be the fixed 3800 -- which on
          # arcana-prd is the PRODUCTION assistant's published port
          # (docker-compose.yml: '127.0.0.1:3800:3800'). `main.ts` listens on
          # 0.0.0.0, and a wildcard bind next to an existing 127.0.0.1 bind
          # either fails outright or succeeds while `curl localhost:3800`
          # still reaches the more specific socket -- i.e. the smoke check
          # would have probed PRODUCTION's /health and passed without ever
          # touching the code under test. An ephemeral port removes the
          # ambiguity: the only thing listening on it is this job's build.
          # Probed with bash's own /dev/tcp rather than a helper binary: this
          # step runs BEFORE setup-node, so node is not on PATH yet, and a
          # missing python3 would take the job down for the wrong reason.
          # 20000-29999 sits below net.ipv4.ip_local_port_range, so the pick
          # cannot collide with an outbound connection's ephemeral port.
          APP_PORT=''
          for _ in $(seq 1 50); do
            CANDIDATE=$(( (RANDOM % 10000) + 20000 ))
            if ! (exec 3<>"/dev/tcp/127.0.0.1/${CANDIDATE}") 2>/dev/null; then
              APP_PORT="${CANDIDATE}"
              break
            fi
            exec 3>&- 3<&- || true
          done
          test -n "${APP_PORT}" || { echo "no free port found in 20000-29999"; exit 1; }
          echo "smoke app port: ${APP_PORT}"
          echo "PORT=${APP_PORT}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: bash scripts/ci/retry-network.sh 3 pnpm install --frozen-lockfile
      - run: cd apps/assistant && pnpm exec prisma generate
      - run: pnpm --filter @arcanada/core build
      - run: pnpm --filter assistant build
      - name: Run prisma migrate deploy
        run: cd apps/assistant && pnpm exec prisma migrate deploy
      - name: Boot app + smoke /health
        run: |
          set -uo pipefail
          : "${PORT:?PORT was not resolved by the port-resolution step}"
          cd apps/assistant
          node dist/main.js > /tmp/assistant.log 2>&1 &
          APP_PID=$!
          # ARCA-0033 intent: verify the app boots, not that all upstreams
          # are reachable (Scrutator/MC/OpsBot stubs intentionally point at
          # invalid hosts in CI). Treat any HTTP response from /health as
          # boot success — only TCP-refused / no-response within 30 s fails.
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:${PORT}/health" || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "smoke responded http=${HTTP_CODE} after ${i}s"
              cat /tmp/health.json
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          echo "smoke failed: /health did not respond within 30s"
          echo "--- assistant.log (tail 200) ---"
          tail -200 /tmp/assistant.log || true
          kill -9 $APP_PID || true
          exit 1

  # SEC-0063: this job used to own its own deploy path — it held a runner-owned
  # checkout at /opt/arcanada-assistant, wrote the production .env there with a
  # heredoc, and drove `docker compose` against the host socket directly. That
  # is the arrangement SEC-0028 removed from every other service on arcana-prod
  # on 2026-07-30; the assistant was the one that was missed. When the `docker`
  # group was retired the job did not start failing quietly — it failed loudly,
  # at `permission denied ... /var/run/docker.sock`, on every push to main since.
  #
  # Three defects died with the old block, and they are worth naming because
  # none of them is about the docker socket:
  #   * The heredoc was unquoted, so backticks in its own explanatory comment
  #     were executed as command substitutions by the runner's shell. Harmless
  #     text this time; the construction is arbitrary command execution.
  #   * `git reset --hard origin/main` ran in a runner-owned .git, so nothing
  #     stopped the runner from repointing `origin` or checking out any SHA.
  #     The broker refuses a SHA that is not an ancestor of origin/main.
  #   * The .env was runner-owned 0600 — mode 600 protects a file from other
  #     users, not from its owner. Eight production credentials were readable
  #     by the runner account for as long as this job existed. They now live in
  #     /etc/arcanada/deploy-env/arcanada-assistant.env, root-owned, and are
  #     re-installed into the checkout by the broker on every sync.
  deploy:
    needs: [lint, test, audit, smoke]
    if: github.ref == 'refs/heads/main'
    # No `docker` label: this runner deliberately cannot reach the socket, and
    # a label claiming otherwise would misroute unrelated jobs onto production.
    #
    # A HOST-UNIQUE label rather than the shared `arcana-prod`, which sits on
    # more than one runner: a deploy landing on the wrong machine is at best a
    # preflight failure and at worst a second, EMPTY stack that reports
    # success — the assistant's postgres volume exists on one host only.
    #
    # INFRA-0417 (2026-09-16) consolidated three machines onto arcana-prd. The
    # postgres volume moved with the service: it is re-synced from the source
    # host while the source stack is stopped, so the new stack starts on the
    # same data rather than on a fresh volume. The `verify` job below is what
    # proves that — it asserts postgres and redis are `ok` BY NAME in the
    # health body, which is exactly the assertion an assistant talking to an
    # empty database fails.
    runs-on: [self-hosted, linux, arcana-prd-host]
    steps:
      - uses: actions/checkout@v7
      - name: Verify deploy-broker capability
        env:
          BROKER_PREFLIGHT_SERVICE: arcanada-assistant
        run: bash scripts/ci/runner-broker-preflight.sh

      # The broker takes a service name from a compiled-in allowlist and a
      # commit SHA, and nothing else. No credential on stdin: this repository
      # is public, so `AUTH` is deliberately absent from its broker row and an
      # empty-stdin read would fail the sync.
      - name: Sync broker checkout to this commit
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant sync "$GITHUB_SHA"

      - name: Build image
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant build

      - name: Bring up stack
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant up

  verify:
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    # Same host as deploy, and for the same reason: this job curls
    # 127.0.0.1:3800 and asks the broker for logs, both of which are only
    # meaningful on the machine the stack actually runs on. Moved to
    # arcana-prd with the deploy job above (INFRA-0417).
    runs-on: [self-hosted, linux, arcana-prd-host]
    steps:
      # A2-222 — this job had no checkout; the deployed-build gate below needs one, because the
      # expectation it compares against is the digest of THIS commit's image inputs, computed
      # from the repository. Without an explicit checkout a self-hosted runner would offer
      # whatever a previous job left in the workspace, at whatever commit that was.
      - uses: actions/checkout@v7

      - name: Wait for /health
        run: |
          set -euo pipefail
          # A 503 is still accepted, because an upstream this deploy does not
          # own (Model Connector, Munera, Ops Bot) being unreachable is not a
          # reason to fail the assistant's own release. But 503 alone is too
          # weak a gate on its own: it is also what an assistant talking to an
          # EMPTY database would return, and that is precisely the failure a
          # botched compose-project rename produces — a parallel stack on a
          # fresh volume, serving happily. So the owned dependencies are
          # asserted by name from the body: postgres and redis must be `ok`
          # whatever the status code says.
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3800/health || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "responded http=${HTTP_CODE} after ${i}s"
              cat /tmp/health.json
              echo
              for dep in postgres redis; do
                STATE=$(python3 -c "import json;print(json.load(open('/tmp/health.json'))['dependencies'].get('${dep}',{}).get('status','ABSENT'))")
                if [ "$STATE" != "ok" ]; then
                  echo "verify failed: owned dependency ${dep} is '${STATE}', expected 'ok'"
                  sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant logs 200 || true
                  exit 1
                fi
                echo "owned dependency ${dep}: ok"
              done
              exit 0
            fi
            sleep 1
          done
          echo "health check did not respond within 30s"
          curl -v http://127.0.0.1:3800/health || true
          sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant logs 200 || true
          exit 1

      # A2-222 — the gate that proves the deploy landed. It replaced
      # `arcanada-compose-broker arcanada-assistant freshness`, which asserted the
      # container is younger than the broker's MAXAGE. That was a proxy for
      # INFRA-0039's silent no-op build, and it is the wrong one: any merge that
      # changes no file the image is built from (docs, .github/, ops/) produces a
      # byte-identical image, compose correctly recreates nothing, and the check
      # fails a deploy that landed. Measured on argana, same broker verb,
      # 2026-09-23: `container argana-argana-1 is 2197s old (limit 600s)` on a
      # merge whose image was identical. Production was right and the red was
      # false — and a red everyone knows to ignore is how a real one gets ignored.
      #
      # This asks the question the deploy actually has to answer: is the process
      # serving traffic built from THIS commit's image inputs? The image is
      # single-stage and builds in place, so the sources it was built from are
      # still in the container; /health digests them and this step recomputes the
      # same digest from the checkout above. Unchanged image → equal digests →
      # green with nothing recreated. Changed image that never reached the
      # container → different digests → red, which IS the INFRA-0039 no-op. A
      # service that cannot name what it was built from is red as `could not
      # prove`, never green.
      #
      # It runs after the /health wait because it needs the service to answer, and
      # it accepts a 503 for the same reason that step does: a degraded upstream
      # is not an undeployed release.
      #
      # Nothing was removed from the broker — its CONTAINER and MAXAGE rows for
      # this service stay in the table (removing a row is a root re-install on
      # arcana-prd, not a CI change); they are simply no longer what this deploy's
      # verdict rests on.
      - name: Deployed-build gate (the container runs THIS commit's image)
        run: python3 scripts/ci/deployed-build-gate.py

      # Asserts the stack the broker drives is the one that was already live:
      # same compose project, therefore the same `arcanada-assistant_postgres-data`
      # volume. A parallel stack on a fresh volume is the migration's worst case.
      - name: Status snapshot
        run: sudo -n /usr/local/sbin/arcanada-compose-broker arcanada-assistant ps

  notify-on-fail:
    needs: [lint, test, audit, smoke, deploy, verify]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Notify Ops Bot
        run: |
          curl -fsS -X POST https://ops.arcanada.one/events \
            -H "Authorization: Bearer ${{ secrets.OPSBOT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "category": "fatal",
              "service": "arcanada-assistant",
              "source": "github-actions",
              "message": "CI/CD pipeline failed on '"${GITHUB_REF}"' (run '"${GITHUB_RUN_ID}"')",
              "details": {
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "sha": "${{ github.sha }}"
              }
            }' || true
